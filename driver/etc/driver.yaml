Name: driver.rpc
ListenOn: 0.0.0.0:6000
Timeout: 30000

Etcd:
  Hosts:
    - 10.211.55.5:2379
  Key: driver.rpc

# MySQL — 连接池参数显式配置
DataSource: "root:admin@zzp@tcp(10.211.55.5:3306)/online_car?charset=utf8mb4&parseTime=true&loc=Local"
MysqlConf:
  MaxOpenConns: 100
  MaxIdleConns: 20
  ConnMaxLifetime: 300s

# Redis — 连接池配置
RedisConf:
  Host: 10.211.55.5:6379
  Type: node
  PoolSize: 100

# 日志
Log:
  ServiceName: driver.rpc
  Mode: console
  Level: info
  Encoding: json
