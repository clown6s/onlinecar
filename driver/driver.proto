syntax = "proto3";

package driver;

option go_package = "./pb";

// ========== 司机服务 ==========
service Driver {
  // 注册
  rpc Register(RegisterReq) returns(RegisterResp);
  // 登录
  rpc Login(LoginReq) returns(LoginResp);
  // 更新位置
  rpc UpdateLocation(UpdateLocationReq) returns(Empty);
  // 获取司机信息
  rpc GetDriver(GetDriverReq) returns(DriverInfo);
  // 获取司机状态
  rpc GetDriverWorkStatus(GetDriverWorkStatusReq) returns(DriverWorkStatusInfo);
  // 更新司机状态
  rpc UpdateDriverWorkStatus(UpdateDriverWorkStatusReq) returns(Empty);
}

message Empty {}

// 注册请求
message RegisterReq {
  string driver_name  = 1; // 司机姓名
  string driver_phone = 2; // 手机号
  string password     = 3; // 密码
  string vehicle_no   = 4; // 车牌号
  string vehicle_type = 5; // 车辆类型
  int64  commercial_type = 6; // 服务类型：1网约车 2巡游 3合乘
}

// 注册响应
message RegisterResp {
  int64  id              = 1;
  string driver_name     = 2;
  string driver_phone    = 3;
  int64  state           = 4; // 0有效 1失效
}

// 登录请求
message LoginReq {
  string driver_phone = 1;
  string password     = 2;
}

// 登录响应
message LoginResp {
  int64  id           = 1;
  string driver_name  = 2;
  int64  state        = 3;
}

// 更新位置
message UpdateLocationReq {
  int64  id  = 1;
  double lng = 2;
  double lat = 3;
}

// 获取司机信息请求
message GetDriverReq {
  int64 id = 1;
}

// 司机详细信息
message DriverInfo {
  int64  id                      = 1;
  string driver_name             = 2;
  string driver_phone            = 3;
  int64  driver_gender           = 4; // 1男 2女
  string license_id              = 5; // 驾驶证号
  string certificate_no          = 6; // 从业资格证号
  int64  commercial_type         = 7; // 服务类型
  string vehicle_no              = 8; // 车牌号
  string vehicle_type            = 9; // 车辆类型
  string brand                   = 10; // 车辆品牌
  string model                   = 11; // 车辆型号
  int64  state                   = 12; // 司机状态
  int64  work_status             = 13; // 0收车 1出车 2暂停
}

// 获取司机工作状态
message GetDriverWorkStatusReq {
  int64 driver_id = 1;
}

// 司机工作状态
message DriverWorkStatusInfo {
  int64 driver_id   = 1;
  int64 work_status = 2; // 0收车 1出车 2暂停
}

// 更新司机工作状态
message UpdateDriverWorkStatusReq {
  int64 driver_id   = 1;
  int64 work_status = 2; // 0收车 1出车 2暂停
}
