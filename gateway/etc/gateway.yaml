Name: gateway-api
Host: 0.0.0.0
Port: 7000
Timeout: 30000

# JWT 配置
AuthDriver:
  AccessSecret: "onlinecar-driver-secret-2026"
  AccessExpire: 86400s

AuthPassenger:
  AccessSecret: "onlinecar-passenger-secret-2026"
  AccessExpire: 86400s

# Driver RPC
DriverRpc:
  Timeout: 5000
  KeepaliveTime: "30s"
  NonBlock: true
  # 断路器：ResourceNotFound 和 PermissionDenied 不重试，避免无效重试放大压力
  DoNotRetryGrpcCodes:
    - ResourceNotFound
    - PermissionDenied
  Etcd:
    Hosts:
      - 10.211.55.5:2379
    Key: driver.rpc

# Passenger RPC
PassengerRpc:
  Timeout: 5000
  KeepaliveTime: "30s"
  NonBlock: true
  DoNotRetryGrpcCodes:
    - ResourceNotFound
    - PermissionDenied
  Etcd:
    Hosts:
      - 10.211.55.5:2379
    Key: passenger.rpc

# District RPC
DistrictRpc:
  Timeout: 5000
  KeepaliveTime: "30s"
  NonBlock: true
  DoNotRetryGrpcCodes:
    - ResourceNotFound
    - PermissionDenied
  Etcd:
    Hosts:
      - 10.211.55.5:2379
    Key: district.rpc

# Redis — 连接池配置
RedisConf:
  Host: 10.211.55.5:6379
  Type: node
  Pass: "admin@zzp"
  PoolSize: 100

# CORS — 生产环境填写具体域名，开发环境按需添加 localhost
CORS:
  AllowOrigins: []  # 空 = 拒绝所有跨域，需要时填 ["http://localhost:5173"]

# 日志
Log:
  ServiceName: gateway-api
  Mode: console
  Level: info
  Encoding: json
