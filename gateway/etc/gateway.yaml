Name: gateway-api
Host: 0.0.0.0
Port: 7000
Timeout: 30000

# JWT 配置
AuthDriver:
  AccessSecret: "onlinecar-driver-secret-2026"
  AccessExpire: 86400s

AuthPassenger:
  AccessSecret: "onlinecar-passenger-secret-2026"
  AccessExpire: 86400s

# Driver RPC
DriverRpc:
  Etcd:
    Hosts:
      - 10.211.55.5:2379
    Key: driver.rpc

# Passenger RPC
PassengerRpc:
  Etcd:
    Hosts:
      - 10.211.55.5:2379
    Key: passenger.rpc


# District RPC
DistrictRpc:
  Etcd:
    Hosts:
      - 10.211.55.5:2379
    Key: district.rpc

# Redis
RedisConf:
  Host: 10.211.55.5:6379
  Type: node
  Pass: "admin@zzp"

# CORS
CORS:
  AllowOrigins:
    - "*"  # 生产环境替换为具体域名，如 ["https://app.onlinecar.com"]

# 日志
Log:
  ServiceName: gateway-api
  Mode: console
  Level: info
  Encoding: json
