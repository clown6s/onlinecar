name: onlinecar

services:
  # ========== 基础设施 ==========

  # etcd 3 节点集群（开发测试环境，无认证）
  etcd-1:
    image: quay.io/coreos/etcd:v3.6.9
    restart: unless-stopped
    environment:
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd-1:2380,etcd2=http://etcd-2:2380,etcd3=http://etcd-3:2380
      ETCD_CLUSTER_STATE: new
      TZ: Asia/Shanghai
    # 端口不暴露到宿主机，仅容器内网络可访问
    # ports:
    #   - "2379:2379"
    volumes:
      - etcd1_data:/etcd-data
    networks:
      - onlinecar
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  etcd-2:
    image: quay.io/coreos/etcd:v3.6.9
    restart: unless-stopped
    environment:
      ETCD_NAME: etcd2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd-1:2380,etcd2=http://etcd-2:2380,etcd3=http://etcd-3:2380
      ETCD_CLUSTER_STATE: new
      TZ: Asia/Shanghai
    volumes:
      - etcd2_data:/etcd-data
    networks:
      - onlinecar
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  etcd-3:
    image: quay.io/coreos/etcd:v3.6.9
    restart: unless-stopped
    environment:
      ETCD_NAME: etcd3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd-1:2380,etcd2=http://etcd-2:2380,etcd3=http://etcd-3:2380
      ETCD_CLUSTER_STATE: new
      TZ: Asia/Shanghai
    volumes:
      - etcd3_data:/etcd-data
    networks:
      - onlinecar
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "OnlineCar@2026#Prod"
      MYSQL_DATABASE: online_car
      MYSQL_USER: onlinecar_app
      MYSQL_PASSWORD: "${DB_APP_PASSWORD:-OnlineCar@2026#App}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
      - --slow-query-log=1
      - --long-query-time=2
      - --log-queries-not-using-indexes=1
    # 端口不暴露到宿主机，仅容器内网络可访问
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pOnlineCar@2026#Prod"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass OnlineCar@2026#Redis
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    # 端口不暴露到宿主机
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - REDIS_PASSWORD=OnlineCar@2026#Redis
      - TZ=Asia/Shanghai
    user: "redis:redis"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Jaeger 链路追踪 v2
  # 镜像基于 distroless，无 wget/curl，健康检查用 /proc
  jaeger:
    image: jaegertracing/jaeger:2.3.0
    container_name: onlinecar-jaeger
    restart: unless-stopped
    command: --config=/etc/jaeger/config.yaml
    ports:
      - "16686:16686"   # Jaeger UI
    # OTLP 端口仅容器内访问
    # ports:
    #   - "4317:4317"
    #   - "4318:4318"
    volumes:
      - ./config/jaeger-config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger_data:/var/lib/jaeger
    networks:
      - onlinecar
    # jaeger 2.x 镜像基于 distroless，无 shell，不设 healthcheck
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # Loki 日志存储
  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    user: "loki:loki"
    # 端口不暴露到宿主机，仅容器内网络可访问（Grafana 通过容器网络连接）
    # ports:
    #   - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Promtail 日志采集
  promtail:
    image: grafana/promtail:3.5.1
    restart: unless-stopped
    volumes:
      - onlinecar_logs:/var/log/onlinecar:ro
      - nginx_logs:/var/log/nginx:ro
      - promtail_positions:/var/promtail/positions
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - onlinecar
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Grafana 可视化
  grafana:
    image: grafana/grafana:11.5.2
    container_name: onlinecar-grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./config/grafana-dashboards:/etc/grafana/provisioning/dashboards/json:ro
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_PASSWORD: "admin@zzp"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DEFAULT_LANGUAGE: "zh-Hans"
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Prometheus 指标采集
  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: onlinecar-prometheus
    restart: unless-stopped
    user: "65534:65534"
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./config/alert_rules.yaml:/etc/prometheus/alert_rules.yaml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.wal-compression"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      driver:
        condition: service_healthy
      passenger:
        condition: service_healthy
      district:
        condition: service_healthy
      gateway:
        condition: service_healthy
      mysql-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      etcd-1:
        condition: service_started
      etcd-2:
        condition: service_started
      etcd-3:
        condition: service_started
      loki:
        condition: service_healthy
    networks:
      - onlinecar
    # prom/prometheus v3 基于 scratch，无 wget/shell，不设 healthcheck
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # Alertmanager 告警管理
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: onlinecar-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yaml"
      - "--storage.path=/alertmanager"
    environment:
      TZ: Asia/Shanghai
    networks:
      - onlinecar
    # prom/alertmanager 基于 scratch，无 wget/shell，不设 healthcheck
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # OTEL Collector 链路追踪采集
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    container_name: onlinecar-otel-collector
    restart: unless-stopped
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 日志目录权限初始化（一次性任务，chown 给 UID 1000）
  log-init:
    image: alpine:3.19
    environment:
      TZ: Asia/Shanghai
    command: sh -c "mkdir -p /var/log/onlinecar && chown -R 1000:1000 /var/log/onlinecar"
    volumes:
      - onlinecar_logs:/var/log/onlinecar
    networks:
      - onlinecar
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  # ========== 业务服务 ==========
  driver:
    build:
      context: ..
      dockerfile: deploy/driver/Dockerfile
    # gRPC 端口仅容器内互通，不暴露
    # ports:
    #   - "6000:6000"
    # Prometheus metrics 端口（仅容器内网络，Prometheus 通过容器名访问）
    # ports:
    #   - "9100:9100"
    environment:
      OTEL_SERVICE_NAME: driver.rpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: always_on
      DB_PASSWORD: "OnlineCar@2026#Prod"
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:-OnlineCar@2026#App}"
      REDIS_PASSWORD: "OnlineCar@2026#Redis"
    depends_on:
      log-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - onlinecar_logs:/var/log/onlinecar
      - ./config/driver.yaml:/app/etc/driver.yaml:ro
    networks:
      - onlinecar
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  passenger:
    build:
      context: ..
      dockerfile: deploy/passenger/Dockerfile
    # gRPC 端口仅容器内互通，不暴露
    # ports:
    #   - "6001:6001"
    # Prometheus metrics 端口（仅容器内网络，Prometheus 通过容器名访问）
    # ports:
    #   - "9101:9101"
    environment:
      OTEL_SERVICE_NAME: passenger.rpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: always_on
      DB_PASSWORD: "OnlineCar@2026#Prod"
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:-OnlineCar@2026#App}"
      REDIS_PASSWORD: "OnlineCar@2026#Redis"
    depends_on:
      log-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - onlinecar_logs:/var/log/onlinecar
      - ./config/passenger.yaml:/app/etc/passenger.yaml:ro
    networks:
      - onlinecar
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6001"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  district:
    build:
      context: ..
      dockerfile: deploy/district/Dockerfile
    # gRPC 端口仅容器内互通，不暴露
    # ports:
    #   - "6002:6002"
    # Prometheus metrics 端口（仅容器内网络，Prometheus 通过容器名访问）
    # ports:
    #   - "9102:9102"
    environment:
      OTEL_SERVICE_NAME: district.rpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: always_on
      DB_PASSWORD: "OnlineCar@2026#Prod"
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:-OnlineCar@2026#App}"
      REDIS_PASSWORD: "OnlineCar@2026#Redis"
    depends_on:
      log-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - onlinecar_logs:/var/log/onlinecar
      - ./config/district.yaml:/app/etc/district.yaml:ro
    networks:
      - onlinecar
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6002"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    # Gateway 仅容器内网络访问，通过 Nginx 反向代理对外暴露
    # ports:
    #   - "7000:7000"
    expose:
      - "7000"
    environment:
      OTEL_SERVICE_NAME: gateway-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: always_on
      ONLINECAR_DRIVER_JWT_SECRET: "oc-drv-a3f8e2c1d9b45678prod2026"
      ONLINECAR_PASSENGER_JWT_SECRET: "oc-pax-7e1b9c4f2a8d5678prod2026"
    depends_on:
      log-init:
        condition: service_completed_successfully
      driver:
        condition: service_healthy
      passenger:
        condition: service_healthy
      district:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - onlinecar_logs:/var/log/onlinecar
      - ./config/gateway.yaml:/app/etc/gateway.yaml:ro
    networks:
      - onlinecar
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # ========== 反向代理 ==========

  # Nginx 反向代理（TLS 终止、速率限制、安全响应头）
  nginx:
    image: nginx:1.27-alpine
    container_name: onlinecar-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      # 生产环境启用 TLS 后开放 443
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ========== Exporter ==========

  # MySQL Exporter（Prometheus 采集 MySQL 指标）
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "onlinecar_app:${DB_APP_PASSWORD:-OnlineCar@2026#App}@tcp(mysql:3306)/online_car"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - onlinecar
    # prom/mysqld-exporter 基于 scratch，无 wget/shell，不设 healthcheck
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  # Redis Exporter（Prometheus 采集 Redis 指标）
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "OnlineCar@2026#Redis"
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9121"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

