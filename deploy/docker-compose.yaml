name: onlinecar

services:
  # ========== 基础设施 ==========

  # etcd 3 节点集群（认证由 etcd-setup 初始化）
  etcd-1:
    image: quay.io/coreos/etcd:v3.6.9
    environment:
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd-1:2380,etcd2=http://etcd-2:2380,etcd3=http://etcd-3:2380
      ETCD_CLUSTER_STATE: new
    # 端口不暴露到宿主机，仅容器内网络可访问
    # ports:
    #   - "2379:2379"
    volumes:
      - etcd1_data:/etcd-data
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  etcd-2:
    image: quay.io/coreos/etcd:v3.6.9
    environment:
      ETCD_NAME: etcd2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd-1:2380,etcd2=http://etcd-2:2380,etcd3=http://etcd-3:2380
      ETCD_CLUSTER_STATE: new
    volumes:
      - etcd2_data:/etcd-data
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  etcd-3:
    image: quay.io/coreos/etcd:v3.6.9
    environment:
      ETCD_NAME: etcd3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd-1:2380,etcd2=http://etcd-2:2380,etcd3=http://etcd-3:2380
      ETCD_CLUSTER_STATE: new
    volumes:
      - etcd3_data:/etcd-data
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "OnlineCar@2026#Prod"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
      - --slow-query-log=1
      - --long-query-time=2
      - --log-queries-not-using-indexes=1
    # 端口不暴露到宿主机，仅容器内网络可访问
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pOnlineCar@2026#Prod"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis:8.6.2-alpine
    command: >
      redis-server
      --requirepass OnlineCar@2026#Redis
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    # 端口不暴露到宿主机
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "OnlineCar@2026#Redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Jaeger 链路追踪 v2
  jaeger:
    image: jaegertracing/jaeger:2.3.0
    container_name: onlinecar-jaeger
    restart: unless-stopped
    user: "0:0"
    command: --config=/etc/jaeger/config.yaml
    ports:
      - "16686:16686"   # Jaeger UI
    # OTLP 端口仅容器内访问
    # ports:
    #   - "4317:4317"
    #   - "4318:4318"
    volumes:
      - ./config/jaeger-config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger_data:/var/lib/jaeger
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  # Loki 日志存储
  loki:
    image: grafana/loki:3.5.1
    # 端口不暴露到宿主机，仅容器内网络可访问（Grafana 通过容器网络连接）
    # ports:
    #   - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Promtail 日志采集
  promtail:
    image: grafana/promtail:3.5.1
    volumes:
      - onlinecar_logs:/var/log/onlinecar:ro
      - promtail_positions:/var/promtail/positions
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - onlinecar
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Grafana 可视化
  grafana:
    image: grafana/grafana:11.5.2
    container_name: onlinecar-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_PASSWORD: "admin@zzp"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DEFAULT_LANGUAGE: "zh-Hans"
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - onlinecar
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 日志目录权限初始化（一次性任务，chown 给 UID 1000）
  log-init:
    image: alpine:3.19
    command: sh -c "mkdir -p /var/log/onlinecar && chown -R 1000:1000 /var/log/onlinecar"
    volumes:
      - onlinecar_logs:/var/log/onlinecar
    networks:
      - onlinecar
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  # etcd 认证初始化（一次性任务，创建用户并启用认证）
  etcd-setup:
    image: quay.io/coreos/etcd:v3.6.9
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    networks:
      - onlinecar
    entrypoint: >
      sh -c "
        ENDPOINTS=http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379 &&
        echo '>>> Setting root password...' &&
        etcdctl --endpoints=$$ENDPOINTS user passwd root --new-user-password='OnlineCar@2026#Etcd' &&
        echo '>>> Creating onlinecar user...' &&
        etcdctl --endpoints=$$ENDPOINTS user add onlinecar --new-user-password='OnlineCar@2026#EtcdApp' &&
        echo '>>> Creating role and granting permissions...' &&
        etcdctl --endpoints=$$ENDPOINTS role add onlinecar-role &&
        etcdctl --endpoints=$$ENDPOINTS role grant-permission onlinecar-role readwrite '' &&
        etcdctl --endpoints=$$ENDPOINTS user grant onlinecar onlinecar-role &&
        echo '>>> Enabling auth...' &&
        etcdctl --endpoints=$$ENDPOINTS auth enable &&
        echo '>>> etcd auth setup completed!'
      "
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  # ========== 业务服务 ==========
  driver:
    build:
      context: ../driver
      dockerfile: ../deploy/driver/Dockerfile
    # gRPC 端口仅容器内互通，不暴露
    # ports:
    #   - "6000:6000"
    environment:
      OTEL_SERVICE_NAME: driver.rpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      DB_PASSWORD: "OnlineCar@2026#Prod"
      REDIS_PASSWORD: "OnlineCar@2026#Redis"
    depends_on:
      log-init:
        condition: service_completed_successfully
      etcd-setup:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    volumes:
      - onlinecar_logs:/var/log/onlinecar
      - ./config/driver.yaml:/app/etc/driver.yaml:ro
    networks:
      - onlinecar
    restart: on-failure
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  passenger:
    build:
      context: ../passenger
      dockerfile: ../deploy/passenger/Dockerfile
    # gRPC 端口仅容器内互通，不暴露
    # ports:
    #   - "6001:6001"
    environment:
      OTEL_SERVICE_NAME: passenger.rpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      DB_PASSWORD: "OnlineCar@2026#Prod"
      REDIS_PASSWORD: "OnlineCar@2026#Redis"
    depends_on:
      log-init:
        condition: service_completed_successfully
      etcd-setup:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    volumes:
      - onlinecar_logs:/var/log/onlinecar
      - ./config/passenger.yaml:/app/etc/passenger.yaml:ro
    networks:
      - onlinecar
    restart: on-failure
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6001"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  gateway:
    build:
      context: ../gateway
      dockerfile: ../deploy/gateway/Dockerfile
    ports:
      - "7000:7000"
    environment:
      OTEL_SERVICE_NAME: gateway-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_TRACES_SAMPLER: always_on
      ONLINECAR_DRIVER_JWT_SECRET: "oc-drv-a3f8e2c1d9b45678prod2026"
      ONLINECAR_PASSENGER_JWT_SECRET: "oc-pax-7e1b9c4f2a8d5678prod2026"
    depends_on:
      log-init:
        condition: service_completed_successfully
      etcd-setup:
        condition: service_completed_successfully
      driver:
        condition: service_started
      passenger:
        condition: service_started
      jaeger:
        condition: service_healthy
    volumes:
      - onlinecar_logs:/var/log/onlinecar
      - ./config/gateway.yaml:/app/etc/gateway.yaml:ro
    networks:
      - onlinecar
    restart: on-failure
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  mysql_data:
  redis_data:
  loki_data:
  jaeger_data:
  grafana_data:
  onlinecar_logs:
  promtail_positions:

networks:
  onlinecar:
    driver: bridge
