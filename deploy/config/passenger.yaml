Name: passenger.rpc
ListenOn: 0.0.0.0:6001
Timeout: 30000
GracefulShutdownTimeout: 25s
KeepaliveTime: "30s"
KeepaliveTimeout: "10s"

Etcd:
  Hosts:
    - etcd-1:2379
    - etcd-2:2379
    - etcd-3:2379
  Key: passenger.rpc

# MySQL
DataSource: "onlinecar_app:${DB_APP_PASSWORD}@tcp(mysql:3306)/online_car?charset=utf8mb4&parseTime=true&loc=Local"
MaxOpenConns: 100
MaxIdleConns: 20
ConnMaxLifetime: 300

# Prometheus metrics
MetricsPort: 9101

# 日志：console 模式输出到 stdout，docker logs 可见
# 服务稳定后改回 file 模式，由 Promtail 采集
Log:
  ServiceName: passenger.rpc
  Mode: console
  Path: /var/log/onlinecar
  Level: info
  Encoding: json
  KeepDays: 7
  Compress: true
