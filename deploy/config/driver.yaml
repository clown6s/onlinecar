Name: driver.rpc
ListenOn: 0.0.0.0:6000
Timeout: 30000
GracefulShutdownTimeout: 25s
KeepaliveTime: "30s"
KeepaliveTimeout: "10s"

Etcd:
  Hosts:
    - etcd-1:2379
    - etcd-2:2379
    - etcd-3:2379
  Key: driver.rpc

# MySQL
DataSource: "onlinecar_app:${DB_APP_PASSWORD}@tcp(mysql:3306)/online_car?charset=utf8mb4&parseTime=true&loc=Local"
MaxOpenConns: 100
MaxIdleConns: 20
ConnMaxLifetime: 300

# Redis
RedisConf:
  Host: redis:6379
  Type: node
  Pass: "OnlineCar@2026#Redis"

# Prometheus metrics
MetricsPort: 9100

# 日志：console 模式输出到 stdout，docker logs 可见
# 服务稳定后改回 file 模式，由 Promtail 采集
Log:
  ServiceName: driver.rpc
  Mode: console
  Path: /var/log/onlinecar
  Level: info
  Encoding: json
  KeepDays: 7
  Compress: true
