Name: gateway-api
Host: 0.0.0.0
Port: 7000
Timeout: 30000
GracefulShutdownTimeout: 25s

# JWT 配置（Secret 从环境变量注入）
AuthDriver:
  AccessSecret: "oc-drv-a3f8e2c1d9b45678prod2026"
  AccessExpire: 86400s

AuthPassenger:
  AccessSecret: "oc-pax-7e1b9c4f2a8d5678prod2026"
  AccessExpire: 86400s

# Driver RPC
DriverRpc:
  Etcd:
    Hosts:
      - etcd-1:2379
      - etcd-2:2379
      - etcd-3:2379
    Key: driver.rpc
    User: onlinecar
    Pass: "OnlineCar@2026#EtcdApp"

# Passenger RPC
PassengerRpc:
  Etcd:
    Hosts:
      - etcd-1:2379
      - etcd-2:2379
      - etcd-3:2379
    Key: passenger.rpc
    User: onlinecar
    Pass: "OnlineCar@2026#EtcdApp"

# District RPC
DistrictRpc:
  Etcd:
    Hosts:
      - etcd-1:2379
      - etcd-2:2379
      - etcd-3:2379
    Key: district.rpc
    User: onlinecar
    Pass: "OnlineCar@2026#EtcdApp"

# Redis（短信验证码存储）
RedisConf:
  Host: redis:6379
  Pass: "OnlineCar@2026#Redis"
  Type: node

# CORS（生产环境指定具体域名）
CORS:
  AllowOrigins:
    - "https://app.onlinecar.com"
    - "https://admin.onlinecar.com"

# 日志（file 模式，Promtail 采集）
Log:
  ServiceName: gateway-api
  Mode: file
  Path: /var/log/onlinecar
  Level: info
  Encoding: json
  KeepDays: 7
  Compress: true
