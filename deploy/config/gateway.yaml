Name: gateway-api
Host: 0.0.0.0
Port: 7000
Timeout: 30000
GracefulShutdownTimeout: 25s

# JWT 配置（Secret 从环境变量注入）
AuthDriver:
  AccessSecret: "oc-drv-a3f8e2c1d9b45678prod2026"
  AccessExpire: 86400s

AuthPassenger:
  AccessSecret: "oc-pax-7e1b9c4f2a8d5678prod2026"
  AccessExpire: 86400s

# Driver RPC
DriverRpc:
  Etcd:
    Hosts:
      - etcd-1:2379
      - etcd-2:2379
      - etcd-3:2379
    Key: driver.rpc
  Timeout: 5000
  KeepaliveTime: "30s"

# Passenger RPC
PassengerRpc:
  Etcd:
    Hosts:
      - etcd-1:2379
      - etcd-2:2379
      - etcd-3:2379
    Key: passenger.rpc
  Timeout: 5000
  KeepaliveTime: "30s"

# District RPC
DistrictRpc:
  Etcd:
    Hosts:
      - etcd-1:2379
      - etcd-2:2379
      - etcd-3:2379
    Key: district.rpc
  Timeout: 5000
  KeepaliveTime: "30s"

# Redis
RedisConf:
  Host: redis:6379
  Pass: "OnlineCar@2026#Redis"
  Type: node

# CORS
CORS:
  AllowOrigins:
    - "https://app.onlinecar.com"
    - "https://admin.onlinecar.com"

# 日志：console 模式输出到 stdout，docker logs 可见
# 服务稳定后改回 file 模式，由 Promtail 采集
Log:
  ServiceName: gateway-api
  Mode: console
  Path: /var/log/onlinecar
  Level: info
  Encoding: json
  KeepDays: 7
  Compress: true
