server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/promtail/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: onlinecar
    static_configs:
      - targets:
          - localhost
        labels:
          job: onlinecar
          env: production
        __path__: /var/log/onlinecar/**/*.log
